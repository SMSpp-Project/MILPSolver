default:
  image: registry.gitlab.com/smspp/smspp-project

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - smspp-project

stages:
  - build
  - test
  - test-miqp
  - deploy

build:
  stage: build
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SMSPP_DEPLOY_KEY")
    - mkdir -p ~/.ssh && ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    # the pull does not recurse into the submodules: CMake initializes
    # the ones the enabled modules need, and a revision the pull walks
    # through may pin a submodule commit no longer on its remote
    - if [ -d smspp-project ]; then (cd smspp-project && git pull --no-recurse-submodules && git submodule update --recursive); else git clone --branch develop git@gitlab.com:smspp/smspp-project.git; fi
    - cmake -S smspp-project -B smspp-project/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_MILPSolver=ON -DBUILD_tests=ON
    - cmake --build smspp-project/build --target install
  artifacts:
    paths:
      - smspp-project/build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

# the suite is 170 minutes against the 3h cap a job has on the GitLab.com
# shared runners, and the quadratic objective over integer variables is 75 of
# them, so it is split into two SEQUENTIAL stages of comparable weight. It
# also makes the retry affordable: a session cap hit by one of the two
# second-long tests then costs the lighter half, not the whole suite.
.test_template:
  # the academic Gurobi WLS license caps concurrent sessions: a test job may
  # abort at startup with "GRBstartenv returned with status 10030" when other
  # Gurobi-heavy pipelines hold the sessions. Retry to ride out the contention.
  retry:
    max: 2
    when: script_failure
  timeout: 24h
  before_script:
    # write the Gurobi WLS license from the masked CI/CD variables, if set
    - |
      if [ -n "$GRB_WLSSECRET" ]; then
        printf 'LICENSEID=%s\nWLSACCESSID=%s\nWLSSECRET=%s\n' \
          "$GRB_LICENSEID" "$GRB_WLSACCESSID" "$GRB_WLSSECRET" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

test:
  extends: .test_template
  stage: test
  script:
    - ctest -V -C Release -L "$CI_PROJECT_TITLE" -E "quad_test/batches/batchQL_I" --test-dir smspp-project/build --no-tests=error

test-miqp:
  extends: .test_template
  stage: test-miqp
  script:
    - ctest -V -C Release -L "$CI_PROJECT_TITLE" -R "quad_test/batches/batchQL_I" --test-dir smspp-project/build --no-tests=error

deploy:
  stage: deploy
  script:
    - cd smspp-project/build && cpack -G "TGZ;ZIP;TBZ2"
  artifacts:
    paths:
      - smspp-project/build/*.tar.gz
      - smspp-project/build/*.tar.bz2
      - smspp-project/build/*.zip
  only:
    - tags
